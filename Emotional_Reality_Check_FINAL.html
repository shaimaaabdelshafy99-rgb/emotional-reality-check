:root{--navy:#102e50;--teal:#078e9b;--muted:#587189;--border:#d9e8ed;--paper:#fff;--bg:#f4fafb;--soft:#e6f4f6;--coral:#ef6d69;--gold:#efb44e;--purple:#8273ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#d8f1f4,transparent 35%),linear-gradient(135deg,#f8fcfd,#eff7f9);font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--navy)}button{font:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.app{max-width:1220px;margin:auto;padding:27px 24px 62px}.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--teal);font-weight:800;text-transform:uppercase}.eyebrow:before{content:'';display:inline-block;width:36px;height:6px;background:var(--teal);border-radius:6px;vertical-align:3px;margin-right:12px}h1{font-size:clamp(34px,4.7vw,58px);line-height:1.04;letter-spacing:-.04em;margin:24px 0 12px}h1 em{font-style:normal;color:var(--teal)}h2{font-size:clamp(26px,3vw,38px);margin:8px 0 14px;letter-spacing:-.025em}h3{font-size:19px;margin:10px 0}p{line-height:1.55}.lead{font-size:18px;color:var(--muted);max-width:860px}.panel{background:white;border:1px solid var(--border);border-radius:23px;box-shadow:0 12px 36px rgba(18,61,85,.08)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:28px}.scenario{overflow:hidden;display:flex;flex-direction:column}.scenario img{width:100%;aspect-ratio:1.7;object-fit:cover;display:block}.scenario .content{padding:17px;flex:1;display:flex;flex-direction:column}.pill{font-size:11px;font-weight:800;letter-spacing:.055em;padding:7px 10px;border-radius:30px;background:#e6f5f7;color:#087f91;display:inline-block;align-self:start}.scenario p{font-size:14px;color:var(--muted);margin:3px 0 15px}.scenario button{margin-top:auto}.btn{border:0;border-radius:14px;padding:12px 19px;background:var(--teal);color:white;font-weight:750;transition:.18s}.btn:hover{filter:brightness(.93);transform:translateY(-1px)}.btn.secondary{bac splay:none}.footer{border-top:1px solid #d6e6eb;margin-top:35px;padding-top:15px;font-size:12px;color:var(--muted)}.footer b{color:var(--teal)}@media(max-width:930px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:590px){.app{padding:18px 14px 40px}.grid,.evidence{grid-template-columns:1fr}.stagehead{align-items:flex-start;flex-direction:column}.case,.result{padding:18px}.quote{font-size:16px}h1{font-size:36px}.scenario img{aspect-ratio:2.3}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

y without inventing a cause. It also creates a short, evidence-focused next step."},{"label":"Wait until every detail is confirmed before replying at all.","feedback":"Accuracy matters, but complete silence before a time-sensitive client meeting may leave key stakeholders unable to plan."},{"label":"Share the handoff timestamp and request a direct follow-up from the next team, without a joint update.","feedback":"This contributes a useful record, but a one-sided update may leave the client-facing owner without a coordinated explanation."}],"firstPreferred":0,"evidence":["The operations system records your team's handoff at 10:02, within the agreed window.","The downstream acceptance timestamp is missing; IT is checking a synchronization issue.","The client meeting begins in 45 minutes; a verified root cause is not yet available.","The escalation email was also sent to other teams involved in the process."],"evidenceInsight":"A timely operations handoff is supported; the source of the delay is still unconfirmed. The distribution list alone does not prove a blame intention.","reframe":"'We have evidence for our handoff, but not enough to identify the point of delay. I can share confirmed facts and an update time.'","finalOptions":[{"label":"Delay all external updates until every delivery milestone has been independently verified.","feedback":"This minimizes the risk of an inaccurate claim but withholds verified information stakeholders need immediately."},{"label":"Attribute the delay to the receiving team, noting that their timestamp is unavailable.","feedback":"A missing timestamp may reflect a sync problem, not a confirmed operational fault. This risks shifting blame without verification."},{"label":"Share the verified handoff, name the open checks, assign owners, and commit to an update.","feedback":"This protects credibility and supports the client conversation without overclaiming. The cause can be updated when the audit trail is verified."}],"finalPreferred":2,"summaryFeel":"Anxiety can be real even if the assumption 'they want to blame my team' is unverified.","summaryEvidence":"The handoff was timely; downstream acceptance needs investigation. No verified cause yet.","takeaway":"Separate confirmed timeline facts from motives and root-cause claims; communicate with a clear next-update commitment.","evidenceQuestion":"What can you responsibly say before the client meeting?","evidenceChoices":["Because the system may have a sync issue, no delay actually occurred.","We can confirm our handoff time; the downstream gap and cause remain under investigation.","Our on-time handoff proves another team caused the delay."],"evidenceWhy":["A possible synchronization problem does not cancel the reported delay or establish its cause.","Correct: this separates verified timeline evidence from unresolved responsibility and gives stakeholders actionable certainty.","A verified handoff does not identify the downstream cause. Missing timestamps are not proof of fault."],"feelingBest":1,"beliefBest":0,"evidenceBest":1,"transferPrompt":"What is one verified fact, one unresolved cause, and one time-bound next action?","consequences":{"initial":["The account team has a time-stamped handoff and a stated investigation owner; the client update can distinguish the known timeline from the open cause.","The account team must brief the client without even a provisional fact; the lack of a status update increases escalation risk.","The account team forwards your claim to leadership; the downstream team disputes it, and the ownership debate grows before the client meeting."],"final":["The case remains open but the client receives no usable update; stakeholders have to chase ownership.","The downstream team challenges your attribution; senior leaders request evidence of its fault that is not available.","The client receives a precise confirmed handoff time and a time-bound investigation update while the unresolved gap is tracked."]}},{"area":"PROJECT MANAGEMENT","character":"Karim","role":"project lead","title":"The Last-Minute Scope Change","short":"A business-critical feature is requested three days before go-live.","setup":"Three days before a planned go-live, a senior stakeholder asks for a new feature. The team is still completing testing, and a change may affect scope, release risk, and capacity. The stakeholder compares your team to others.","quote":"Other teams have been more flexible with similar requests.","unknown":"There is no documented impact assessment or confirmed deadline flexibility.","feelingChoices":["I want to accept the request immediately so conflict ends","I expect the stakeholder will see me as uncooperative","I feel under pressure and frustrated by the comparison"],"beliefChoices":["The requested feature is three days before go-live","If I discuss a trade-off, they'll label me inflexible","I am feeling frustrated by the request"],"identifyFeedback":"Pressure is a feeling. Predicting that stakeholders will label you uncooperative is a belief about their future judgment, not an established fact.","firstOptions":[{"label":"Reject the request as unreasonable and end the discussion.","feedback":"This protects the current plan, but may ignore a valid business need and prevent collaborative options."},{"label":"Promise the feature will be included to show flexibility.","feedback":"This protects rapport in the moment, but bypasses testing and effort assessment and can create delivery risk."},{"label":"Acknowledge the need and run a time-boxed impact assessment before committing.","feedback":"This responds constructively while protecting evidence-based planning and making trade-offs visible."}],"firstPreferred":2,"evidence":["The feature needs an estimated two days of engineering plus one day of QA.","Current release testing already occupies the QA team until go-live.","The stakeholder's underlying regulatory deadline is ten days away, not three.","A manual workaround might cover the release, but Security and Operations have not yet approved its use."],"evidenceInsight":"The business need remains important. The regulatory deadline allows time to evaluate options, but the proposed workaround is not approved; feasibility and controls still need checking.","reframe":"'A scope discussion isn't proof I'm uncooperative. I can show options and their consequences.'","finalOptions":[{"label":"Assess a conditional workaround with Security and Operations, then schedule a tested release.","feedback":"Best supported: this protects testing, checks approval dependencies, and proposes a conditional route rather than promising an unapproved workaround."},{"label":"Defer the feature to a later release without assessing whether an interim option is viable.","feedback":"This avoids short-term release risk, but rules out alternatives before their feasibility and approval status are assessed."},{"label":"Include the feature at go-live and reduce QA coverage to protect the requested date.","feedback":"This prioritizes one feature at the expense of testing assurance and increases avoidable release risk."}],"finalPreferred":0,"summaryFeel":"Feeling pressure is understandable; being perceived as uncooperative was only a prediction.","summaryEvidence":"The later regulatory deadline creates room to assess a staged plan. The manual workaround remains a proposal pending Security and Operations approval.","takeaway":"Use impact evidence and options to challenge all-or-nothing beliefs about collaboration.","evidenceQuestion":"Which recommendation best fits the newly revealed constraints?","evidenceChoices":["A workaround may bridge go-live if the relevant teams approve it; full scope still needs impact and testing decisions.","The regulatory need makes a full feature launch in three days mandatory.","The request can be postponed indefinitely because it arrived late."],"evidenceWhy":["Correct: this is conditional, not a guarantee. Confirm owners, approvals, and controls before using the workaround.","The actual regulatory deadline is later, and QA capacity is already committed.","The evidence shows a legitimate need with a viable time-boxed option, not grounds for indefinite rejection."],"evidenceBest":0,"feelingBest":2,"beliefBest":1,"transferPrompt":"Which deadline was assumed, and what trade-off became possible when it was verified?","consequences":{"initial":["The stakeholder escalates because the business dependency was dismissed before its real deadline was clarified.","The stakeholder expects delivery at go-live; QA flags that the new feature cannot pass the planned test cycle.","A trade-off discussion opens: the business requirement is taken seriously without promising untested scope."],"final":["A conditional trade-off discussion opens. The workaround is not promised until Security and Operations approve it; a tested release is planned separately.","The stakeholder escalates the unresolved need, because options were ruled out before being assessed.","The feature enters go-live without complete testing; defects or rollback become credible delivery risks."]}},{"area":"CUSTOMER EXPERIENCE","character":"Salma","role":"customer experience specialist","title":"The Complaint That Went Public","short":"A major customer posts an unresolved complaint on LinkedIn.","setup":"A strategic customer publishes a public complaint and names the company. Leadership requests a prompt response. CRM shows three previous contacts, but the case notes don't yet explain the service failure. A colleague suggests publicly saying the customer ignored the process.","quote":"Three contacts, no resolution. Does anyone there actually take ownership?","unknown":"The reason for non-resolution and responsibility across the handoffs remain unverified.","feelingChoices":["I want to publish a rebuttal before the post spreads","I feel stressed and defensive about the public criticism","The client deliberately damaged our reputation"],"beliefChoices":["We must publicly defend the company before verifying the account","CRM records three previous contacts","I feel under pressure to respond urgently"],"identifyFeedback":"The urgency and defensiveness are plausible emotions and impulses. The rule 'we must defend the company before checking' is a belief about necessary action, not a fact.","firstOptions":[{"label":"Stay completely silent until all internal records are reconciled.","feedback":"This avoids premature claims but may look unresponsive and misses a chance to show ownership quickly."},{"label":"Post a brief empathetic acknowledgment and arrange a case review with an accountable owner.","feedback":"This can be fast and accurate: acknowledge the concern without attributing cause before verification."},{"label":"Publish that the client failed to follow procedures.","feedback":"This may feel protective but makes an unsupported public claim and can escalate reputational harm."}],"firstPreferred":1,"evidence":["CRM confirms three contacts and no recorded closure.","An internal handoff note says the case was waiting for a specialist queue assignment.","The published FAQ does not clearly explain that handoff step.","There is no evidence the customer missed a required action."],"evidenceInsight":"The initial defensiveness had no evidentiary basis for blaming the customer. Internal coordination is a plausible concern, though its full cause still needs confirmation.","reframe":"'We can protect trust by responding promptly, owning the review, and avoiding unsupported explanations.'","finalOptions":[{"label":"Post that customer noncompliance caused the delay and investigate the record afterwards.","feedback":"The newly revealed records directly weaken this claim; publication would be misleading and could worsen trust."},{"label":"Wait for the full investigation before responding publicly, even without acknowledging receipt.","feedback":"This avoids an unsupported public claim, but extended silence may undermine trust. Consider a factual interim acknowledgment."},{"label":"Acknowledge the concern publicly; arrange a private follow-up and review the case history.","feedback":"This demonstrates responsiveness and protects customer privacy while a verified account of causes is developed."}],"finalPreferred":2,"summaryFeel":"Stress is valid; the belief that public blame is necessary can be tested.","summaryEvidence":"Three contacts are verified, and no evidence indicates customer noncompliance.","takeaway":"Respond quickly without claiming a cause you have not established; coordinate accountability and follow-up.","beliefBest":0,"evidenceQuestion":"What does the latest evidence justify saying publicly?","evidenceChoices":["The missing closure record proves the specialist team was negligent.","The unclear FAQ means we should admit the company deliberately misled the customer.","We can acknowledge the complaint and repeated contacts without blaming the customer or publishing private case details."],"evidenceWhy":["An unclear handoff supports investigation, not a proven finding of negligence.","An unclear FAQ is not evidence of intentional deception.","Correct: this states what can be acknowledged and retains appropriate uncertainty and confidentiality."],"evidenceBest":2,"feelingBest":1,"transferPrompt":"What can be acknowledged publicly without alleging fault or exposing personal details?","consequences":{"initial":["The complaint continues gaining visibility with no sign that the company has taken ownership.","The customer sees a prompt acknowledgment and private follow-up route, while the investigation gains a named owner.","The customer challenges your public allegation and requests its factual basis; communications asks for an urgent correction."],"final":["The customer shares CRM contact history contradicting your public accusation, forcing a correction and further escalation.","The customer still has no response or owner, so the reputational and service issue persists.","The response acknowledges recorded contacts, protects private details, and starts an accountable internal handoff review."]}},{"area":"LEARNING & DEVELOPMENT","character":"Omar","role":"L&D specialist","title":"The Training Evaluation Surprise","short":"Executives question whether a well-liked training program improved performance.","setup":"Your team delivered an L&D program. Post-session satisfaction results are high. In a review, a senior executive asks for evidence of performance improvement. The evaluation plan had not included a consistent post-training workplace measure.","quote":"I don't see sufficient evidence that this training improved performance.","unknown":"Participant satisfaction is measured, but sustained on-the-job behavior and business impact have not yet been established.","feelingChoices":["The executive believes all training is worthless","I want to defend the program using the satisfaction score","I feel disappointed and defensive about the evaluation question"],"beliefChoices":["The executive asked for evidence of job performance improvement","I feel disappointed by the executive feedback","Management doesn't respect the value of L&D"],"identifyFeedback":"Disappointment is an emotion. 'Management doesn't value L&D' infers a broad attitude from one request for evidence. The evaluation question itself is a fact.","firstOptions":[{"label":"Defend the course using the high satisfaction percentage as proof of performance impact.","feedback":"Satisfaction is useful reaction data, but it does not establish behavior change or business results."},{"label":"Ask to defer the impact discussion until a full KPI evaluation can be commissioned.","feedback":"A full evaluation could be valuable, but delaying all discussion misses an opportunity to state current evidence limits and establish near-term measures."},{"label":"Acknowledge the evidence gap and propose a practical post-training behavior measure.","feedback":"This accepts the valid measurement question while preserving the program's strengths and building an evaluation plan."}],"firstPreferred":2,"evidence":["Reaction surveys average 4.6/5, but these are participant perceptions.","A skills practice exercise improved within-session accuracy, but no workplace follow-up was performed.","Line managers can observe two target behaviors during the next 30 days.","No baseline was recorded for the relevant operational KPI."],"evidenceInsight":"There is encouraging learning and reaction evidence but insufficient transfer or impact evidence. A follow-up plan can close part of the gap; causal business claims still need careful design.","reframe":"'The executive is asking for stronger evidence, not necessarily rejecting L&D. I can improve the evaluation plan.'","finalOptions":[{"label":"Explain data limits, agree on observable behaviors, and set up manager follow-up and KPIs.","feedback":"This differentiates evidence levels and proposes feasible measurement improvements without claiming unsupported causality."},{"label":"Present the 4.6/5 satisfaction result as confirmation that workplace performance improved.","feedback":"This confuses reaction data with behavior and business impact. It overstates what the data can support."},{"label":"Pause future cohorts entirely until leadership agrees that satisfaction is enough evidence.","feedback":"This reacts to the perceived criticism rather than addressing an actionable evaluation gap."}],"finalPreferred":0,"summaryFeel":"Disappointment is real; 'leadership doesn't value us' isn't established by the challenge.","summaryEvidence":"Satisfaction and within-session practice are known. Transfer and performance impact are not yet verified.","takeaway":"Respond to critical feedback by distinguishing evidence levels and designing evaluation rather than defending a belief.","beliefBest":2,"evidenceQuestion":"Which conclusion is supported by the training data?","evidenceChoices":["The 4.6/5 rating proves the program changed on-the-job behavior.","Without a KPI baseline, we can conclude the training had no value.","Evidence of learner reactions and practice exists; workplace transfer and business impact have not yet been verified."],"evidenceWhy":["Satisfaction and performance transfer are different outcomes. A reaction score cannot verify workplace behavior.","A measurement gap means impact is unknown, not that value is necessarily zero.","Correct: this distinguishes reaction, practice, behavior transfer, and business outcomes without overclaiming."],"feelingBest":2,"evidenceBest":2,"transferPrompt":"What can your current evaluation data demonstrate—and what measurement is still missing?","consequences":{"initial":["The executive asks for measured behavior change rather than positive reaction scores; your defense does not address the request.","The meeting ends without an evidence plan; stakeholders remain unsure what improved.","The executive accepts a follow-up proposal as a constructive next step while the impact claim remains open."],"final":["Line managers are asked to observe two behaviors; future cohorts receive a baseline plan while current evidence is reported with its limits.","The executive requests proof of observed performance change; the satisfaction score cannot answer it.","Development work pauses without evidence that cancellation improves performance measurement."]}}];let state={caseIndex:null,step:0,feeling:null,belief:null,initial:null,evidenceCheck:null,final:null};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function button(label,act,cls=''){return `<button class="btn ${cls}" onclick="${act}">${label}</button>`}function shell(body,scroll=true){document.querySelector('#app').innerHTML=`<div class="eyebrow">EMOTIONAL INTELLIGENCE / DAY 1</div>${body}<footer class="footer"><b>UNDERSTAND</b> → CONNECT → SOLVE · Private learning practice · Not a psychological assessment</footer>`;if(scroll){window.scrollTo({top:0,behavior:'instant'});const heading=document.querySelector('#app h1, #app h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}}function home(){state={caseIndex:null,step:0,feeling:null,belief:null,initial:null,evidenceCheck:null,final:null};shell(`<h1>Emotional <em>Reality Check</em></h1><p class="lead">Four professional workplace dilemmas. Commit to each choice, review the reasoning, then use new evidence to refine your response.</p><div class="panel" style="padding:16px 21px;background:#e9f7f8"><b>Your mission:</b> Acknowledge emotions. Test assumptions. Respond using the evidence available.</div><section class="grid">${cases.map((c,i)=>`<article class="panel scenario"><img src="${pictures[i]}" alt="Illustrated ${safe(c.role)} professional"><div class="content"><span class="pill">0${i+1} · ${safe(c.area)}</span><h3>${safe(c.title)}</h3><p>${safe(c.short)}</p>${button('Enter scenario →',`start(${i})`)}</div></article>`).join('')}</section><p class="footnote">Estimated time: 9 minutes per scenario, plus facilitator debrief. Answers lock when selected to preserve an honest first attempt. Complete one scenario during the workshop; the others are optional exploration.</p>`)}function start(i){state={caseIndex:i,step:1,feeling:null,belief:null,initial:null,evidenceCheck:null,final:null};draw()}function pick(k,v){if(state[k]!==null)return;const oldY=window.scrollY;state[k]=v;draw(false);window.scrollTo({top:oldY,behavior:'instant'});const selected=document.querySelector('[data-choice-key="'+k+'"][data-choice-index="'+v+'"]');if(selected)selected.focus({preventScroll:true})}function move(n){state.step=n;draw()}function options(arr,key){return `<div class="options">${arr.map((o,i)=>`<button class="option ${state[key]===i?'selected':''}" aria-pressed="${state[key]===i}" data-choice-key="${key}" data-choice-index="${i}" onclick="pick('${key}',${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${safe(o)}</span></button>`).join('')}</div>`}function draw(scroll=true){let c=cases[state.caseIndex],s=state.step,body=`<div class="stage"><div class="stagehead"><button class="btn secondary" onclick="home()">← All scenarios</button><div class="progress" aria-label="Step ${s} of 4">${[1,2,3,4].map(x=>`<span class="${x<=s?'on':''}"></span>`).join('')}</div></div><div class="milestone">${["Identify","Initial response","New evidence","Final decision"].map((label,i)=>`<span class="${i+1===s?'current':i+1<s?'past':''}">${label}</span>`).join('')}</div><div class="persona"><img src="${pictures[state.caseIndex]}" alt="Illustrated portrait of ${safe(c.character)}"><div><small>${safe(c.area)} · STEP ${s} OF 4</small><strong>You are ${safe(c.character)}, ${safe(c.role)}</strong></div></div>`;if(s===1){body+=`<h2>${safe(c.title)}</h2><div class="panel case"><p class="smallhead">The situation</p><p>${safe(c.setup)}</p><div class="quote">“${safe(c.quote)}”</div><p>${safe(c.unknown)}</p><p class="smallhead">Which feeling is the most plausible response?</p>${options(c.feelingChoices,'feeling')}<p class="smallhead">Which thought is an unverified belief or prediction?</p>${options(c.beliefChoices,'belief')}${state.feeling!==null?`<div role="status" aria-live="polite" aria-atomic="true" class="feedback ${state.feeling===c.feelingBest?"":"warning"}"><b>Feeling feedback</b><p>${state.feeling===c.feelingBest?"Yes. This describes an emotional experience. The feeling may be valid even though the cause remains unclear.":"Not quite. This describes a belief or an impulse to act, not an emotion. Acknowledge the feeling separately from what you predict or want to do."}</p></div>`:""}${state.belief!==null?`<div role="status" aria-live="polite" aria-atomic="true" class="feedback ${state.belief===c.beliefBest?"":"warning"}"><b>Belief feedback</b><p>${state.belief===c.beliefBest?"Exactly. This is a belief about intent, consequences, or motives that still needs evidence.":"This is not the unsupported belief. A belief goes beyond an observation or feeling. Identify the claim about motives or future consequences that evidence has not established."}</p></div>`:""}<div class="actions">${button('Back to characters','home()','secondary')}${state.feeling===null||state.belief===null?'<button class="btn" disabled>Continue →</button>':button('Continue →','move(2)')}${state.feeling===null||state.belief===null?'<span class="mini muted">Select both answers to continue</span>':''}</div></div>`}else if(s===2){body+=`<h2>Your first response</h2><div class="panel case"><p>You're still under pressure, and the full picture isn't available. What would you do first?</p>${options(c.firstOptions.map(x=>x.label),'initial')}${state.initial!==null?`<div role="status" aria-live="polite" aria-atomic="true" class="feedback ${state.initial===c.firstPreferred?'':'warning'}"><b>Decision feedback</b><p>${safe(c.firstOptions[state.initial].feedback)}</p><div class="consequence"><b>What could happen next</b><p>${safe(c.consequences.initial[state.initial])}</p></div></div>`:''}<div class="actions">${button('← Previous','move(1)','secondary')}${state.initial===null?'<button class="btn" disabled>Reveal new information →</button>':button('Reveal new information →','move(3)')}</div></div>`}else if(s===3){body+=`<h2>New evidence arrives</h2><div class="panel case"><p class="smallhead">Evidence update</p><div class="evidence">${c.evidence.map(e=>`<div>✓ ${safe(e)}</div>`).join('')}</div><p><b>Reality check:</b> ${safe(c.evidenceInsight)}</p><p class="smallhead">${safe(c.evidenceQuestion)}</p>${options(c.evidenceChoices,"evidenceCheck")}${state.evidenceCheck!==null?`<div role="status" aria-live="polite" aria-atomic="true" class="feedback ${state.evidenceCheck===c.evidenceBest?"":"warning"}"><b>Evidence feedback</b><p>${safe(c.evidenceWhy[state.evidenceCheck])}</p><p><b>Balanced reframe:</b> ${safe(c.reframe)}</p></div>`:""}<div class="actions">${button('← Previous','move(2)','secondary')}${state.evidenceCheck===null?'<button class="btn" disabled>Check evidence to continue →</button>':button('Make your final decision →','move(4)')}</div></div>`}else if(s===4){body+=`<h2>Choose the next step</h2><div class="panel case"><p>Now that you have more information, which response is most defensible and constructive?</p>${options(c.finalOptions.map(x=>x.label),'final')}${state.final!==null?`<div role="status" aria-live="polite" aria-atomic="true" class="feedback ${state.final===c.finalPreferred?'':'warning'}"><b>Potential impact — not a guaranteed outcome</b><p>${safe(c.finalOptions[state.final].feedback)}</p><div class="consequence"><b>Possible workplace outcome</b><p>${safe(c.consequences.final[state.final])}</p></div></div>`:''}<div class="actions">${button('← Evidence','move(3)','secondary')}${state.final===null?'<button class="btn" disabled>Finish & reflect →</button>':button('Finish & reflect →','finish()')}</div></div>`}shell(body+'</div>',scroll)}function finish(){let c=cases[state.caseIndex];let metrics=[{label:"Feeling recognition",points:state.feeling===c.feelingBest?10:0,max:10},{label:"Belief identification",points:state.belief===c.beliefBest?15:0,max:15},{label:"Initial judgment",points:state.initial===c.firstPreferred?20:0,max:20},{label:"Evidence review",points:state.evidenceCheck===c.evidenceBest?25:0,max:25},{label:"Final response",points:state.final===c.finalPreferred?30:0,max:30}];let score=metrics.reduce((a,m)=>a+m.points,0);let level="Your choices, your learning";let improvements=metrics.filter(m=>m.points<m.max).map(m=>m.label);let review=improvements.length?improvements.join(", "):"Keep using this careful approach in new situations";shell(`<div class="stage"><h1>Your <em>Decision Reflection</em></h1><div class="panel result"><div class="persona"><img src="${pictures[state.caseIndex]}" alt="${safe(c.character)} illustration"><div><small>SCENARIO COMPLETED · ${safe(c.area)}</small><strong>${safe(c.character)} — ${safe(c.title)}</strong></div></div><div class="insight"><b>${level}</b><p>Review what your decisions protected, what they risked, and what changed when evidence arrived. This practice is not a psychological assessment.</p></div><details class="practice-score"><summary>Optional practice points: ${score}/100 (scenario rubric, not an EI score)</summary><div class="scorecard">${metrics.map(m=>`<div class="metric"><b>${m.points}/${m.max}</b><span>${m.label}</span></div>`).join("")}</div><p class="mini muted">Full points follow the best-supported option in this fictional case. Other actions may be reasonable in different circumstances; the points are for learning, not certification.</p></details><div class="insight"><b>Your next learning priority</b><p>${safe(review)}</p></div><h3>Review your decisions</h3><p class="muted mini">Your score reflects choices in this fictional scenario, not overall EI or personality. Reasonable alternatives may exist. Strong evidence review and final decisions carry greater weight.</p><div class="resultList"><div><b>1 · Feeling vs. belief</b><p>${safe(c.summaryFeel)}</p><p class="reason">You identified ${state.feeling===c.feelingBest?"a plausible feeling":"a statement that was not the feeling"} and ${state.belief===c.beliefBest?"the unsupported belief":"a statement that was not the unsupported belief"}.</p></div><div><b>2 · Your initial response</b><p>${safe(c.firstOptions[state.initial].label)}</p><p class="reason">${safe(c.firstOptions[state.initial].feedback)}</p><div class="consequence"><b>What could happen next</b><p>${safe(c.consequences.initial[state.initial])}</p></div></div><div><b>3 · What changed with evidence</b><p>${safe(c.summaryEvidence)}</p><p class="reason">${state.evidenceCheck===c.evidenceBest?"You kept a distinction between known facts and open questions.":`Reconsider the evidence limits: ${safe(c.evidenceWhy[state.evidenceCheck])}`}</p></div><div><b>4 · Your final choice</b><p>${safe(c.finalOptions[state.final].label)}</p><p class="reason">${safe(c.finalOptions[state.final].feedback)}</p><div class="consequence"><b>Possible workplace outcome</b><p>${safe(c.consequences.final[state.final])}</p></div></div><div><b>Transfer to work</b><p>${safe(c.takeaway)}</p></div></div><div class="insight"><b>Apply the lesson at work</b><p>${safe(c.transferPrompt)}</p></div><p class="smallhead">Reflection: Which initial assumption changed after new information arrived—and why?</p><div class="actions">${button('Try a different character','home()','secondary')}${button('Explore this scenario again (practice only)',`start(${state.caseIndex})`)}</div></div></div>`)}home();</script></body></html>
